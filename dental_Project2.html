<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#17453e" />
<title>Smile Aura Dental &amp; Wellness — Family Dentistry in Bangalore</title>
<meta name="description" content="Smile Aura Dental & Wellness — affordable family dentistry in Bangalore. Packages for individuals, families and senior citizens. Book online, leave feedback, or message the clinic on WhatsApp." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@300..600&display=swap" rel="stylesheet" />
<style>
:root{
  --radius:.875rem;
  --bg:#fbfaf6; --fg:#16332d; --card:#ffffff;
  --primary:#1d5a52; --primary-fg:#faf7ee;
  --secondary:#e9f1ec; --secondary-fg:#2a4b44;
  --muted:#eef2ee; --muted-fg:#5c7671;
  --accent:#f3e8d4; --accent-fg:#4a382a;
  --destructive:#c23b3b;
  --border:#d9e2dc; --input:#d2ddd6;
  --cream:#f8f3e8; --sand:#f2e6d3; --sage:#dfece3;
  --pine:#17453e; --pine-deep:#12352f;
  --whatsapp:#2f9364;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,figure,blockquote,dl,dd{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img,svg{display:block}
input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(29,90,82,.18)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.serif{font-family:var(--display)}
.ico{width:1rem;height:1rem;flex:none}
.ico-sm{width:.875rem;height:.875rem}
.text-wa{color:var(--whatsapp)}
.text-primary{color:var(--primary)}
.container{width:100%;max-width:72rem;margin:0 auto;padding:0 1.25rem}
.wrap-narrow{max-width:76rem}
.section{padding:4rem 0}
@media(min-width:640px){.section{padding:5rem 0}}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--primary)}
.eyebrow-line{display:block;width:1.5rem;height:1px;background:rgba(29,90,82,.4)}
.h2{font-family:var(--display);font-weight:600;font-size:clamp(1.8rem,4vw,2.75rem);line-height:1.08;letter-spacing:-.015em;text-wrap:balance;margin-top:1rem}
.lead{font-size:15px;line-height:1.75;color:var(--muted-fg);margin-top:1rem}
.lead-sm{font-size:13px;line-height:1.85;color:var(--muted-fg)}
.tiny-muted{font-size:11px;line-height:1.6;color:var(--muted-fg)}
.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-5{margin-top:1.25rem}.mt-6{margin-top:1.5rem}.mt-7{margin-top:1.75rem}.mt-8{margin-top:2rem}.mt-10{margin-top:2.5rem}
@media(min-width:640px){.section{padding:5rem 0}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:2.75rem;padding:0 1.25rem;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:.875rem;font-weight:500;border:1px solid transparent;transition:background .2s,border-color .2s,color .2s,transform .2s;text-align:center}
.btn:hover{background:#174840}
.btn-outline{background:transparent;border-color:var(--border);color:var(--fg)}
.btn-outline:hover{background:rgba(23,69,62,.045);border-color:#bccfc6}
.btn-cream{background:var(--cream);color:var(--pine)}
.btn-cream:hover{background:#fdfaf2}
.btn-ghost{background:transparent;color:var(--fg)}
.btn-ghost:hover{background:var(--muted)}
.btn-wa{background:var(--whatsapp);color:#fff}
.btn-wa:hover{background:#297f56}
.btn-sm{height:2.25rem;padding:0 .9rem;font-size:.75rem}
.btn-xs{height:2rem;padding:0 .75rem;font-size:.6875rem}
.btn-lg{height:3rem;font-size:.875rem}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-pine-outline{background:transparent;border-color:rgba(248,243,232,.2);color:var(--cream)}
.btn-pine-outline:hover{background:rgba(248,243,232,.1)}
.link-quiet{color:var(--muted-fg);transition:color .2s}
.link-quiet:hover{color:var(--fg)}

/* brand */
.brand{display:inline-flex;align-items:center;gap:.625rem;min-width:0}
.brand-mark{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:.9rem;background:var(--pine);color:var(--cream);flex:none}
.brand-mark svg{width:1.25rem;height:1.25rem}
.brand-text{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand-name{font-family:var(--display);font-size:1.2rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
@media(min-width:640px){.brand-name{font-size:1.35rem}}
.brand-sub{margin-top:.4rem;font-size:.55rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-fg);white-space:nowrap;display:none}
@media(min-width:640px){.brand-sub{display:block}}
.brand-invert .brand-mark{background:var(--cream);color:var(--pine)}
.brand-invert .brand-name{color:var(--cream)}
.brand-invert .brand-sub{color:rgba(248,243,232,.6)}

/* top band + header */
.band{background:var(--pine);color:rgba(248,243,232,.85)}
.band-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 1.25rem;font-size:11px;letter-spacing:.02em;max-width:72rem;margin:0 auto}
.band-inner p{display:flex;align-items:center;gap:.5rem}
.band-dot{width:6px;height:6px;border-radius:999px;background:rgba(248,243,232,.7);flex:none}
.band a{display:none;align-items:center;gap:.375rem;transition:color .2s}
.band a:hover{color:var(--cream)}
@media(min-width:640px){.band a{display:inline-flex}}
.site-header{position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(217,226,220,.7);background:rgba(251,250,246,.88);backdrop-filter:blur(16px)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:.75rem;height:4.5rem;max-width:72rem;margin:0 auto;padding:0 1rem}
@media(min-width:640px){.header-inner{gap:1.5rem;padding:0 1.25rem}}
.main-nav{display:none;align-items:center;gap:1.5rem}
@media(min-width:1024px){.main-nav{display:flex}}
.nav-link{font-size:.875rem;color:var(--muted-fg);transition:color .2s;position:relative;padding-bottom:2px}
.nav-link:hover{color:var(--fg)}
.nav-link.active{color:var(--fg);font-weight:600}
.nav-link.active::after{content:"";position:absolute;left:0;bottom:0;height:1.5px;width:100%;background:var(--primary)}
.header-actions{display:flex;align-items:center;gap:.5rem;flex:none}
.header-wa{display:none}
@media(min-width:640px){.header-wa{display:inline-flex}}
.header-book span.short{display:inline}
.header-book span.long{display:none}
@media(min-width:640px){.header-book span.short{display:none}.header-book span.long{display:inline}}
.menu-btn{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:999px;border:1px solid var(--border)}
@media(min-width:1024px){.menu-btn{display:none}}
.mobile-nav{display:none;border-top:1px solid rgba(217,226,220,.7);background:var(--card)}
.mobile-nav.open{display:block}
@media(min-width:1024px){.mobile-nav.open{display:none}}
.mobile-nav ul{max-width:72rem;margin:0 auto;padding:.5rem 1.25rem;display:flex;flex-direction:column}
.mobile-nav li a{display:block;padding:.875rem 0;border-bottom:1px solid rgba(217,226,220,.6);font-size:.875rem}
.mobile-nav li:last-child a{border-bottom:0}
.mobile-nav .wa-link{display:flex;align-items:center;gap:.5rem;padding:.875rem 0;font-size:.875rem;font-weight:500;color:var(--whatsapp);border-top:1px solid rgba(217,226,220,.6)}

/* hero */
.hero{position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero-bg .blob-a{position:absolute;top:-12rem;right:-12%;width:38rem;height:38rem;border-radius:999px;background:rgba(223,236,227,.7);filter:blur(64px)}
.hero-bg .blob-b{position:absolute;top:6rem;left:-18%;width:30rem;height:30rem;border-radius:999px;background:rgba(242,230,211,.7);filter:blur(64px)}
.hero-bg .fade{position:absolute;inset-inline:0;bottom:0;height:10rem;background:linear-gradient(to bottom,transparent,var(--bg))}
.hero-grid{display:grid;gap:4rem;align-items:center;padding:3.5rem 1.25rem 5rem;max-width:72rem;margin:0 auto}
@media(min-width:1024px){.hero-grid{grid-template-columns:1.02fr .98fr;padding-top:5rem;padding-bottom:6rem}}
.pill-live{display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;border:1px solid rgba(29,90,82,.15);background:rgba(255,255,255,.7);padding:.375rem .75rem;font-size:11px;font-weight:500;color:var(--primary);backdrop-filter:blur(6px)}
.ping{position:relative;display:flex;width:8px;height:8px}
.ping::before{content:"";position:absolute;inset:0;border-radius:999px;background:rgba(29,90,82,.5);animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.ping span{position:relative;width:8px;height:8px;border-radius:999px;background:var(--primary)}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(2.5rem,7vw,4.15rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance;margin-top:1.5rem}
.hero h1 em{font-style:italic;font-weight:400;color:var(--primary)}
.hero-actions{display:flex;flex-direction:column;gap:.75rem;margin-top:2rem}
@media(min-width:640px){.hero-actions{flex-direction:row}}
.hero-chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2.25rem}
.chip{display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.7);padding:.5rem .875rem;font-size:11px;color:var(--muted-fg)}
.chip svg{color:var(--primary)}
.hero-art{position:relative;width:100%;max-width:30rem;margin:0 auto}
.hours-card{position:relative;overflow:hidden;border-radius:2.25rem;background:var(--pine);color:var(--cream);padding:1.5rem;box-shadow:0 40px 90px -40px rgba(23,69,62,.75)}
@media(min-width:640px){.hours-card{padding:2rem}}
.hours-ring{position:absolute;border-radius:999px;border:1px solid rgba(248,243,232,.1);pointer-events:none}
.hours-ring.one{top:-6rem;right:-4rem;width:16rem;height:16rem}
.hours-ring.two{top:-3.5rem;right:-2rem;width:11rem;height:11rem}
.hours-tooth{position:absolute;right:-2rem;bottom:-3rem;width:13rem;height:13rem;color:rgba(248,243,232,.055);pointer-events:none}
.hours-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.hours-top .label{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:rgba(248,243,232,.55)}
.hours-top .open{border-radius:999px;background:rgba(248,243,232,.1);padding:.25rem .625rem;font-size:10px;font-weight:500;color:rgba(248,243,232,.85)}
.hours-tagline{position:relative;font-family:var(--display);font-size:1.9rem;line-height:1.15;font-weight:500;margin-top:1.75rem;text-wrap:balance}
.hours-sheet{position:relative;margin-top:1.5rem;border-radius:1rem;background:var(--cream);padding:1rem;color:var(--pine);box-shadow:0 10px 15px -3px rgba(23,69,62,.2)}
.hours-sheet .row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.hours-sheet .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(23,69,62,.5)}
.hours-sheet .time{font-family:var(--display);font-size:1.25rem;font-weight:600;margin-top:.25rem}
.hours-sheet .tick-round{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:999px;background:var(--sage);color:var(--pine);flex:none}
.hours-sheet .foot{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1rem;border-top:1px solid rgba(23,69,62,.1);padding-top:.75rem;font-size:11px;color:rgba(23,69,62,.7)}
.hours-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1.25rem}
.hours-stats div{border-radius:.75rem;background:rgba(248,243,232,.06);padding:.625rem .75rem;text-align:center}
.hours-stats b{display:block;font-family:var(--display);font-size:1.125rem;font-weight:600}
.hours-stats span{display:block;margin-top:.125rem;font-size:10px;color:rgba(248,243,232,.55)}
.float-card{position:absolute;display:flex;align-items:center;gap:.625rem;border-radius:1rem;border:1px solid var(--border);background:var(--card);padding:.75rem .875rem;box-shadow:0 20px 25px -5px rgba(23,69,62,.1)}
.float-card .fi{display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:999px;flex:none}
.float-card b{display:block;font-size:11px;font-weight:600}
.float-card small{display:block;font-size:10px;color:var(--muted-fg)}
.float-offer{top:6rem;left:-1rem;display:none;animation:float 7s ease-in-out infinite}
@media(min-width:640px){.float-offer{display:flex}}
.float-offer .fi{background:var(--sand);color:var(--accent-fg)}
.float-call{right:-.5rem;bottom:-1.25rem}
.float-call .fi{background:var(--whatsapp);color:#fff}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* cards & surfaces */
.pine-section{background:var(--pine);color:var(--cream);position:relative;overflow:hidden}
.cream-section{background:var(--cream)}
.card{border:1px solid var(--border);background:var(--card);border-radius:1.5rem}
.card-pad{padding:1.5rem}
@media(min-width:640px){.card-pad{padding:2rem}}
.panel{position:relative;border-radius:1.5rem;border:1px solid var(--border);background:var(--card);padding:1.5rem;box-shadow:0 30px 70px -40px rgba(23,69,62,.35)}
@media(min-width:640px){.panel{padding:2rem}}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.2rem .6rem;font-size:10px;font-weight:500;line-height:1.4}
.badge-sage{background:var(--sage);color:var(--pine)}
.badge-cream{background:rgba(248,243,232,.12);color:var(--cream)}
.badge-accent{background:var(--accent);color:var(--accent-fg)}
.badge-pine{background:var(--pine);color:var(--cream)}
.badge-muted{background:var(--muted);color:var(--muted-fg)}
.badge-dot{background:var(--sand);color:var(--accent-fg)}
.tick{display:grid;place-items:center;width:1rem;height:1rem;border-radius:999px;background:var(--sage);color:var(--pine);flex:none;margin-top:2px}
.tick svg{width:.625rem;height:.625rem;stroke-width:3}
.check-list{display:flex;flex-direction:column;gap:.625rem}
.check-list li{display:flex;align-items:flex-start;gap:.5rem;font-size:.875rem}
.soft-list li{font-size:.75rem;line-height:1.6;color:var(--muted-fg)}
.divider{border:0;border-top:1px solid rgba(217,226,220,.7);margin:0}

/* service grid */
.service-grid{display:grid;gap:1rem}
@media(min-width:640px){.service-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.service-grid{grid-template-columns:repeat(3,1fr)}}
.service-card{display:flex;flex-direction:column;height:100%;border-radius:1.5rem;border:1px solid var(--border);background:var(--card);padding:1.5rem;transition:transform .3s,border-color .3s,box-shadow .3s}
.service-card:hover{transform:translateY(-4px);border-color:rgba(29,90,82,.25);box-shadow:0 24px 60px -32px rgba(23,69,62,.35)}
.service-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.service-icon{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:1rem;background:var(--sage);color:var(--pine);transition:background .3s,color .3s}
.service-card:hover .service-icon{background:var(--pine);color:var(--cream)}
.service-card h3{font-family:var(--display);font-size:1.35rem;font-weight:600;margin-top:1.5rem}
.service-card p{font-size:.875rem;line-height:1.65;color:var(--muted-fg);margin-top:.5rem;flex:1}
.service-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(217,226,220,.7);margin-top:1.25rem;padding-top:1rem;font-size:.75rem;color:var(--muted-fg)}
.service-foot .note{display:flex;align-items:center;gap:.375rem}
.service-foot .book{display:flex;align-items:center;gap:.25rem;font-weight:500;color:var(--primary)}

/* marquee */
.marquee{background:var(--pine);color:var(--cream);border-block:1px solid rgba(18,53,47,.2);padding:1rem 0;overflow:hidden}
.marquee-track{display:flex;width:max-content;animation:marquee 42s linear infinite}
.marquee-item{display:flex;align-items:center;gap:1.75rem;padding:0 1.75rem}
.marquee-item span{font-size:10px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;color:rgba(248,243,232,.65)}
.marquee-item svg{width:.875rem;height:.875rem;color:rgba(248,243,232,.25)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* split sections */
.split{display:grid;gap:2.5rem}
@media(min-width:1024px){.split{grid-template-columns:1fr 1.1fr;align-items:center}}
.split-even{display:grid;gap:3rem}
@media(min-width:1024px){.split-even{grid-template-columns:1fr 1fr;align-items:center}}
.section-head{display:flex;flex-direction:column;gap:1.25rem}
@media(min-width:640px){.section-head{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.pkg-link{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-radius:1rem;border:1px solid rgba(248,243,232,.1);background:rgba(248,243,232,.055);padding:1rem 1.25rem;transition:background .2s}
.pkg-link:hover{background:rgba(248,243,232,.1)}
.pkg-link b{display:block;font-size:.875rem;font-weight:500}
.pkg-link small{display:block;margin-top:.125rem;font-size:11px;color:rgba(248,243,232,.5)}
.pkg-link .meta{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:rgba(248,243,232,.7);flex:none}
.tooth-ghost{position:absolute;color:rgba(248,243,232,.05);pointer-events:none}

/* doctor */
.doctor-grid{display:grid;gap:2.5rem}
@media(min-width:1024px){.doctor-grid{grid-template-columns:.85fr 1.15fr;align-items:center}}
.doctor-card{position:relative;overflow:hidden;max-width:24rem;margin:0 auto;border-radius:2rem;border:1px solid var(--border);background:linear-gradient(135deg,var(--sage),var(--cream) 55%,var(--sand));padding:2rem;text-align:center}
.doctor-avatar{position:relative;display:grid;place-items:center;width:7rem;height:7rem;margin:0 auto;border-radius:999px;border:1px solid rgba(23,69,62,.1);background:rgba(251,250,246,.7);backdrop-filter:blur(4px);font-family:var(--display);font-size:2.25rem;font-weight:600;color:var(--pine)}
.doctor-card .name{position:relative;font-family:var(--display);font-size:1.5rem;font-weight:600;margin-top:1.25rem}
.doctor-card .role{position:relative;margin-top:.25rem;font-size:11px;letter-spacing:.02em;color:var(--primary)}
.doctor-card .note{position:relative;margin-top:.75rem;font-size:.875rem;line-height:1.6;color:var(--muted-fg)}
.info-grid{display:grid;gap:.75rem;margin-top:1.75rem}
@media(min-width:640px){.info-grid{grid-template-columns:1fr 1fr}}
.info-box{border-radius:1rem;border:1px solid var(--border);background:var(--card);padding:1rem}
.info-box svg{color:var(--primary)}
.info-box b{display:block;margin-top:.5rem;font-size:.75rem;font-weight:600}
.info-box p{margin-top:.375rem;font-size:.75rem;line-height:1.6;color:var(--muted-fg)}
.info-box p strong{color:rgba(22,51,45,.8);font-weight:400}

/* faq */
.faq{border-radius:1.5rem;border:1px solid var(--border);background:var(--card);padding:0 1.5rem}
.faq details{border-bottom:1px solid rgba(217,226,220,.7)}
.faq details:last-child{border-bottom:0}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 0;font-size:15px;font-weight:500;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary .chev{transition:transform .2s;color:var(--muted-fg)}
.faq details[open] summary .chev{transform:rotate(180deg)}
.faq .answer{padding:0 1.5rem 1.15rem 0;font-size:.875rem;line-height:1.75;color:var(--muted-fg)}

/* cta band */
.cta-card{position:relative;overflow:hidden;border-radius:2rem;background:var(--pine);color:var(--cream);padding:2.5rem 1.5rem}
@media(min-width:640px){.cta-card{padding:3rem 2.5rem}}
.cta-inner{position:relative;display:flex;flex-direction:column;gap:1.5rem}

function dashboardPage() {
  const staff = getStaff();
  if (!staff) {
    return '<main class="blocked"><div class="card"><div class="lock">' + ico('lock') + '</div>' +
      '<h1>Staff sign in required</h1><p>The clinic console holds patient booking requests and feedback. Sign in with your clinic email to continue.</p>' +

      '<div class="actions"><a class="btn btn-block" href="#/auth">Sign in</a><a class="btn btn-ghost btn-block" href="#/">Back to home</a></div></div></main>';
  }
  const requests = getBookings().slice().sort(function (a, b) { return b.created - a.created; });
  const reviews = getFeedback().slice().sort(function (a, b) { return b.created - a.created; });
  const newRequests = requests.filter(function (r) { return r.status === 'new'; }).length;
  const scheduled = requests.filter(function (r) { return r.status === 'scheduled'; }).length;
  const avg = reviews.length ? (reviews.reduce(function (t, r) { return t + r.rating; }, 0) / reviews.length).toFixed(1) : '\u2014';
  const stats = [
    { label: 'New requests', value: newRequests, icon: 'inbox' },
    { label: 'Scheduled', value: scheduled, icon: 'calendar' },
    { label: 'Total requests', value: requests.length, icon: 'clock' },
    { label: 'Avg. feedback', value: avg, icon: 'star' }
  ].map(function (s) {
    return '<div class="stat"><span class="si">' + ico(s.icon) + '</span><b>' + s.value + '</b><span>' + s.label + '</span></div>';
  }).join('');

  const requestsBody = requests.length
    ? '<div style="display:flex;flex-direction:column;gap:.75rem">' + requests.map(requestCard).join('') + '</div>'
    : '<div class="empty"><span class="empty-ico">' + ico('inbox') + '</span><b>No appointment requests yet</b><p>When a patient sends the booking form, their details land here and in WhatsApp.</p><a class="btn btn-outline btn-sm" href="#/book">Open the booking form</a></div>';
  const feedbackBody = reviews.length
    ? '<div class="fb-grid">' + reviews.map(feedbackCard).join('') + '</div>'
    : '<div class="empty"><span class="empty-ico">' + ico('inbox') + '</span><b>No feedback yet</b><p>Feedback submitted on the website appears here with its rating and treatment.</p><a class="btn btn-outline btn-sm" href="#/book">Open the booking form</a></div>';

  return '<div style="min-height:100vh;background:var(--bg);color:var(--fg)">' +
    '<header class="dash-header"><div class="container"><a href="#/" aria-label="' + CLINIC.legalName + ' home">' + brandHTML(false) + '</a>' +
      '<div class="dash-head-actions"><a class="btn btn-ghost btn-sm view" href="#/">' + ico('arrowLeft', 'ico-sm') + 'View website</a>' +
      '<button class="btn btn-outline btn-sm" type="button" data-action="signout">' + ico('logout', 'ico-sm') + 'Sign out</button></div></div></header>' +
    '<main class="dash-main"><p class="dash-kicker">Staff console</p><h1 class="dash-title">Clinic overview</h1>' +
      '<p class="dash-sub">' + (staff ? 'Signed in as ' + esc(staff) : 'Signed in to the clinic workspace') + ' \u00b7 Every booking and feedback form also opens a WhatsApp message for the patient.</p>' +
      '<div class="stat-grid">' + stats + '</div>' +
      '<div class="tabs" role="tablist"><button class="tab' + (state.tab === 'requests' ? ' active' : '') + '" role="tab" aria-selected="' + (state.tab === 'requests') + '" data-action="tab" data-tab="requests">Requests <span class="count">' + requests.length + '</span></button>' +
        '<button class="tab' + (state.tab === 'feedback' ? ' active' : '') + '" role="tab" aria-selected="' + (state.tab === 'feedback') + '" data-action="tab" data-tab="feedback">Feedback <span class="count">' + reviews.length + '</span></button></div>' +
      '<div class="tab-panel">' + (state.tab === 'requests' ? requestsBody : feedbackBody) + '</div>' +
      '<div class="wa-test"><div class="left"><span class="wi">' + waIcon() + '</span><div><b>Test the patient WhatsApp flow</b>' +
        '<p>Form messages open a prefilled chat with ' + CLINIC.phoneDisplay + '. In the real app the number is set with <code>VITE_CLINIC_WHATSAPP_NUMBER</code>.</p></div></div>' +
        '<a class="btn btn-outline btn-sm" href="' + waLink('Hi ' + CLINIC.name + ' \u2014 this is a test message.') + '" target="_blank" rel="noreferrer">Open WhatsApp</a></div>' +
      '<p class="dash-note">' + ico('lock', 'ico-sm') + 'Patient data is private. Do not share screenshots externally.</p></main></div>';
}

/* ---------- 404 ---------- */
function notFoundPage() {
  return '<main class="nf"><div class="glow" aria-hidden="true"></div><a href="#/" aria-label="' + CLINIC.legalName + ' home">' + brandHTML(false) + '</a>' +
    '<p class="kicker">404 \u00b7 Page not found</p><h1>That page has been extracted.</h1>' +
    '<p>The link may be old or mistyped. The clinic can still help you find the right place.</p>' +
    '<div class="actions"><a class="btn" href="#/">' + ico('arrowLeft') + 'Back to the website</a><a class="btn btn-outline" href="#/book">Book an appointment</a></div></main>';
}

/* ---------- router ---------- */
function currentPath() {
  const raw = location.hash.replace(/^#/, '');
  return raw || '/';
}
function render() {
  const path = currentPath();
  let html;
  if (path === '/') html = shell(path, heroSection() + marqueeSection() + treatmentsPreview() + packagesPreview() + homePage());
  else if (path === '/treatments') html = shell(path, treatmentsPage());
  else if (path === '/packages') html = shell(path, packagesPage());
  else if (path === '/about') html = shell(path, aboutPage());
  else if (path === '/book') html = shell(path, bookPage());
  else if (path === '/feedback') html = shell(path, feedbackPage());
  else if (path === '/contact') html = shell(path, contactPage());
  else if (path === '/auth') html = authPage();
  else if (path === '/dashboard') html = dashboardPage();
  else html = notFoundPage();
  document.title = PAGE_TITLES[path] || ('Page not found \u2014 ' + CLINIC.legalName);
  document.getElementById('app').innerHTML = html;
}

/* ---------- form helpers ---------- */
function clearErrors(form) {
  form.querySelectorAll('[data-err]').forEach(function (el) { el.textContent = ''; });
  form.querySelectorAll('[aria-invalid]').forEach(function (el) { el.removeAttribute('aria-invalid'); });
}
function setError(form, name, message) {
  const target = form.querySelector('[data-err="' + name + '"]');
  if (target) target.textContent = message;
  const field = form.querySelector('[name="' + name + '"]');
  if (field) field.setAttribute('aria-invalid', 'true');
}
function val(form, name) {
  const el = form.querySelector('[name="' + name + '"]');
  return el ? String(el.value || '').trim() : '';
}
function handleBooking(form) {
  clearErrors(form);
  const values = {
    name: val(form, 'name'), phone: val(form, 'phone'), email: val(form, 'email'),
    service: val(form, 'service'), preferredDate: val(form, 'date'), preferredTime: val(form, 'time'), notes: val(form, 'notes')
  };
  const errors = {};
  if (values.name.length < 2) errors.name = 'Please enter your full name.';
  if (values.phone.length < 7) errors.phone = 'Enter a phone number the clinic can reach you on.';
  if (values.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) errors.email = 'Enter a valid email address.';
  if (!values.service) errors.service = 'Choose a treatment.';
  if (!values.preferredDate) errors.date = 'Choose a preferred date.';
  if (!values.preferredTime) errors.time = 'Choose a preferred time.';
  if (values.notes.length > 600) errors.notes = 'Please keep notes under 600 characters.';
  if (Object.keys(errors).length) {
    Object.keys(errors).forEach(function (k) { setError(form, k, errors[k]); });
    return;
  }
  const url = waLink(buildAppointmentMessage(values));
  setBookings(getBookings().concat([{
    id: 'b-' + Date.now(), name: values.name, phone: values.phone, email: values.email,
    service: values.service, preferredDate: values.preferredDate, preferredTime: values.preferredTime,
    notes: values.notes, status: 'new', created: Date.now()
  }]));
  try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {}
  state.bookingDone = { url: url };
  render();
}
function handleFeedback(form) {
  clearErrors(form);
  const values = { rating: state.rating, name: val(form, 'name'), treatment: val(form, 'treatment'), message: val(form, 'message') };
  const errors = {};
  if (!values.rating) errors.rating = 'Tap a star to rate your visit.';
  if (values.name.length < 2) errors.name = 'Please tell us who you are.';
  if (values.message.length < 10) errors.message = 'A sentence or two helps us act on your feedback.';
  if (Object.keys(errors).length) {
    Object.keys(errors).forEach(function (k) { setError(form, k, errors[k]); });
    return;
  }
  const url = waLink(buildFeedbackMessage(values));
  setFeedback(getFeedback().concat([{
    id: 'f-' + Date.now(), name: values.name, rating: values.rating,
    treatment: values.treatment, message: values.message, status: 'new', created: Date.now()
  }]));
  try { window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {}
  state.feedbackDone = { url: url };
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', function (event) {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  const action = el.getAttribute('data-action');
  if (action === 'menu') {
    state.menuOpen = !state.menuOpen;
    render();
  } else if (action === 'tab') {
    state.tab = el.getAttribute('data-tab');
    render();
  } else if (action === 'rate') {
    state.rating = Number(el.getAttribute('data-value')) || 0;
    const wrap = el.closest('[data-stars]');
    if (wrap) wrap.innerHTML = starRow(state.rating);
    const form = el.closest('form');
    const err = form && form.querySelector('[data-err="rating"]');
    if (err) err.textContent = '';
  } else if (action === 'review') {
    const id = el.getAttribute('data-id');
    setFeedback(getFeedback().map(function (f) { return f.id === id ? Object.assign({}, f, { status: 'reviewed' }) : f; }));
    render();
  } else if (action === 'signout') {
    clearStaff();
    state.tab = 'requests';
    location.hash = '#/';
  } else if (action === 'reset-booking') {
    state.bookingDone = null;
    render();
  } else if (action === 'reset-feedback') {
    state.feedbackDone = null;
    state.rating = 0;
    render();
  } else if (action === 'auth-restart') {
    state.authStep = 'email';
    render();
  }
});

document.addEventListener('change', function (event) {
  const sel = event.target.closest('[data-status]');
  if (!sel) return;
  const id = sel.getAttribute('data-status');
  const status = sel.value;
  setBookings(getBookings().map(function (r) { return r.id === id ? Object.assign({}, r, { status: status }) : r; }));
  render();
  const notice = document.createElement('div');
  notice.textContent = 'Marked as ' + (STATUS_STYLES[status] ? STATUS_STYLES[status].label.toLowerCase() : status);
  notice.style.cssText = 'position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--pine);color:var(--cream);padding:.6rem 1rem;border-radius:999px;font-size:.75rem;z-index:80;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)';
  document.body.appendChild(notice);
  setTimeout(function () { notice.remove(); }, 2200);
});

document.addEventListener('submit', function (event) {
  const form = event.target;
  if (form.id === 'booking-form') { event.preventDefault(); handleBooking(form); }
  else if (form.id === 'feedback-form') { event.preventDefault(); handleFeedback(form); }
  else if (form.id === 'auth-email-form') {
    event.preventDefault();
    const email = val(form, 'email');
    const err = form.querySelector('[data-err="email"]');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { if (err) err.textContent = 'Enter a valid clinic email address.'; return; }
    state.authEmail = email;
    state.authStep = 'otp';
    render();
  } else if (form.id === 'auth-otp-form') {
    event.preventDefault();
    const code = val(form, 'code');
    const err = form.querySelector('[data-err="code"]');
    if (!/^\d{6}$/.test(code)) { if (err) err.textContent = 'Enter the six-digit code from your email.'; return; }
    setStaff(state.authEmail || 'staff@smileaura.clinic');
    state.authStep = 'email';
    location.hash = '#/dashboard';
  }
});

window.addEventListener('hashchange', function () {
  state.menuOpen = false;
  state.bookingDone = null;
  state.feedbackDone = null;
  state.rating = 0;
  window.scrollTo(0, 0);
  render();
});

/* ---------- boot ---------- */
seedDemo();
if (!location.hash) {
  try { history.replaceState(null, '', '#/'); } catch (e) { location.hash = '#/'; }
}
render();

</script>
</body>
</html>
